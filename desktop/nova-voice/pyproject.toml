[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-voice-desktop"
version = "0.14.0.dev1"
description = "Reviewed script-driven lessons with scoped scene edits, bounded version history and offline visual comparison."
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6==6.10.2",
  "piper-tts==1.8.0",
  "lameenc==1.9.0",
  "onnxruntime==1.31.1",
  "numpy==2.4.6",
  "soxr==1.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.4", "pyinstaller==6.22.3", "miniaudio==1.72"]

[project.gui-scripts]
nova-voice = "nova_voice.__main__:main"

[tool.setuptools.packages.find]
include = ["nova_voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
